{% extends "base.html" %}
{% block content %}
<h1>Add New Patient</h1>
<form method="post">
    <fieldset>
        <legend>Demographics</legend>
        <label>Full Name: <input type="text" name="name" required></label>
        <label>DOB (e.g. March 14, 1958): <input type="text" name="dob" required></label>
        <label>MRN: <input type="text" name="mrn" required></label>
        <label>Sex:
            <select name="sex">
                <option>Male</option><option>Female</option><option>Other</option>
            </select>
        </label>
        <label>Admitting Physician: <input type="text" name="admitting_physician" required></label>
        <label>Admission Date: <input type="text" name="admission_date" required></label>
        <label>Discharge Date: <input type="text" name="discharge_date" required></label>
    </fieldset>

    <fieldset>
        <legend>Primary Diagnosis (ICD-10)</legend>
        <label>Search code or name: <input type="text" id="primary-code-search" placeholder="e.g. I50.22 or Heart Failure" autocomplete="off"></label>
        <div id="primary-suggestions" class="autocomplete-items"></div>
        <label>Selected Code: <input type="text" name="primary_code" id="primary-code" required readonly></label>
    </fieldset>

    <fieldset>
        <legend>Secondary Diagnoses (optional)</legend>
        <div id="secondary-dx">
            <div class="secondary-row">
                <input type="text" class="secondary-search" placeholder="Search ICD-10 code..." autocomplete="off">
                <input type="text" class="secondary-code" name="secondary_codes" placeholder="Code" readonly>
                <div class="autocomplete-items" style="display:none;"></div>
            </div>
        </div>
        <button type="button" onclick="addSecondaryRow()">+ Add Another Diagnosis</button>
    </fieldset>

    <fieldset>
        <legend>Medications</legend>
        <div id="medications">
            <div class="med-row">
                <input type="text" name="med_name" placeholder="Name">
                <input type="text" name="med_dose" placeholder="Dose">
                <input type="text" name="med_route" placeholder="Route">
                <input type="text" name="med_frequency" placeholder="Frequency">
                <input type="text" name="med_purpose" placeholder="Purpose">
            </div>
        </div>
        <button type="button" onclick="addMedRow()">+ Add Medication</button>
    </fieldset>

    <fieldset>
        <legend>Allergies</legend>
        <div id="allergies">
            <div class="allergy-row">
                <input type="text" name="allergy_name" placeholder="Allergen">
                <input type="text" name="allergy_reaction" placeholder="Reaction">
            </div>
        </div>
        <button type="button" onclick="addAllergyRow()">+ Add Allergy</button>
    </fieldset>

    <fieldset>
        <legend>Discharge Instructions</legend>
        <textarea name="discharge_instructions" rows="4" placeholder="One per line"></textarea>
    </fieldset>

    <fieldset>
        <legend>Follow-Up Appointments</legend>
        <div id="followups">
            <div class="fu-row">
                <input type="text" name="fu_provider" placeholder="Provider">
                <input type="text" name="fu_specialty" placeholder="Specialty">
                <input type="text" name="fu_date" placeholder="Date">
                <input type="text" name="fu_contact" placeholder="Contact">
            </div>
        </div>
        <button type="button" onclick="addFuRow()">+ Add Follow-Up</button>
    </fieldset>

    <fieldset>
        <legend>Clinical Notes</legend>
        <textarea name="notes" rows="3"></textarea>
    </fieldset>

    <button type="submit" class="btn">Save Patient</button>
</form>

<script>
// ── Autocomplete for primary diagnosis ──
const primarySearch = document.getElementById('primary-code-search');
const primarySuggestions = document.getElementById('primary-suggestions');
const primaryCode = document.getElementById('primary-code');

if (primarySearch) {
    primarySearch.addEventListener('input', function() {
        const val = this.value.trim();
        if (val.length < 1) {
            primarySuggestions.innerHTML = '';
            return;
        }
        fetch('/api/icd10/search?q=' + encodeURIComponent(val))
            .then(res => res.json())
            .then(data => {
                primarySuggestions.innerHTML = '';
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.textContent = item.code + ' - ' + item.name;
                    div.addEventListener('click', function() {
                        primaryCode.value = item.code;
                        primarySearch.value = item.code + ' - ' + item.name;
                        primarySuggestions.innerHTML = '';
                    });
                    primarySuggestions.appendChild(div);
                });
            });
    });
    document.addEventListener('click', function(e) {
        if (!primarySearch.contains(e.target) && !primarySuggestions.contains(e.target)) {
            primarySuggestions.innerHTML = '';
        }
    });
}

// ── Autocomplete for secondary rows ──
function attachAutocomplete(row) {
    const searchInput = row.querySelector('.secondary-search');
    const codeInput = row.querySelector('.secondary-code');
    const suggestionsDiv = row.querySelector('.autocomplete-items');
    if (!searchInput || !codeInput || !suggestionsDiv) return;

    searchInput.addEventListener('input', function() {
        const val = this.value.trim();
        if (val.length < 1) {
            suggestionsDiv.style.display = 'none';
            suggestionsDiv.innerHTML = '';
            return;
        }
        fetch('/api/icd10/search?q=' + encodeURIComponent(val))
            .then(res => res.json())
            .then(data => {
                suggestionsDiv.innerHTML = '';
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.textContent = item.code + ' - ' + item.name;
                    div.addEventListener('click', function() {
                        codeInput.value = item.code;
                        searchInput.value = item.code + ' - ' + item.name;
                        suggestionsDiv.style.display = 'none';
                        suggestionsDiv.innerHTML = '';
                    });
                    suggestionsDiv.appendChild(div);
                });
                suggestionsDiv.style.display = data.length ? 'block' : 'none';
            });
    });
    document.addEventListener('click', function(e) {
        if (!searchInput.contains(e.target) && !suggestionsDiv.contains(e.target)) {
            suggestionsDiv.style.display = 'none';
            suggestionsDiv.innerHTML = '';
        }
    });
}

document.addEventListener('DOMContentLoaded', function() {
    const existingRow = document.querySelector('#secondary-dx .secondary-row');
    if (existingRow) attachAutocomplete(existingRow);
});

function addSecondaryRow() {
    const container = document.getElementById('secondary-dx');
    const row = document.createElement('div');
    row.className = 'secondary-row';
    row.innerHTML = `
        <input type="text" class="secondary-search" placeholder="Search ICD-10 code..." autocomplete="off">
        <input type="text" class="secondary-code" name="secondary_codes" placeholder="Code" readonly>
        <div class="autocomplete-items" style="display:none;"></div>
    `;
    container.appendChild(row);
    attachAutocomplete(row);
}

function addMedRow() {
    const div = document.createElement('div');
    div.className = 'med-row';
    div.innerHTML = `
        <input type="text" name="med_name" placeholder="Name">
        <input type="text" name="med_dose" placeholder="Dose">
        <input type="text" name="med_route" placeholder="Route">
        <input type="text" name="med_frequency" placeholder="Frequency">
        <input type="text" name="med_purpose" placeholder="Purpose">
    `;
    document.getElementById('medications').appendChild(div);
}
function addAllergyRow() {
    const div = document.createElement('div');
    div.className = 'allergy-row';
    div.innerHTML = `
        <input type="text" name="allergy_name" placeholder="Allergen">
        <input type="text" name="allergy_reaction" placeholder="Reaction">
    `;
    document.getElementById('allergies').appendChild(div);
}
function addFuRow() {
    const div = document.createElement('div');
    div.className = 'fu-row';
    div.innerHTML = `
        <input type="text" name="fu_provider" placeholder="Provider">
        <input type="text" name="fu_specialty" placeholder="Specialty">
        <input type="text" name="fu_date" placeholder="Date">
        <input type="text" name="fu_contact" placeholder="Contact">
    `;
    document.getElementById('followups').appendChild(div);
}
</script>
{% endblock %}
